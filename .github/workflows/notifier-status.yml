name: Notifier status

on:
  schedule:
    # Daily heartbeat at 07:40 UTC
    - cron: "40 7 * * *"

  # Manual run = heartbeat/status test.
  workflow_dispatch:

  # Trigger immediately whenever any monitored workflow completes.
  workflow_run:
    workflows:
      - "Check TUM student jobs"
      - "Check TUM Living"
      - "Check Isar Aerospace student jobs"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  failure-alert:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Send immediate Discord failure alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_STATUS }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}

        run: |
          python3 - <<'PY' > /tmp/discord-payload.json
          import json
          import os

          payload = {
              "username": "Notifier Monitor",
              "embeds": [{
                  "title": "🔴 Notifier failure",
                  "description": (
                      f"**{os.environ['WORKFLOW_NAME']}** "
                      "did not complete successfully."
                  ),
                  "fields": [
                      {
                          "name": "Status",
                          "value": os.environ["CONCLUSION"],
                          "inline": True,
                      },
                      {
                          "name": "Run",
                          "value": f"#{os.environ['RUN_NUMBER']}",
                          "inline": True,
                      },
                      {
                          "name": "Branch",
                          "value": os.environ["BRANCH"] or "unknown",
                          "inline": True,
                      },
                      {
                          "name": "GitHub Actions",
                          "value": (
                              f"[Open failed run]"
                              f"({os.environ['RUN_URL']})"
                          ),
                          "inline": False,
                      },
                  ],
                  "footer": {
                      "text": "Immediate failure alert"
                  },
              }],
              "allowed_mentions": {
                  "parse": []
              },
          }

          print(json.dumps(payload))
          PY

          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "User-Agent: Notifier-Monitor/1.0" \
            --data-binary @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"

  daily-heartbeat:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'

    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Build combined status payload
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}

        run: |
          python3 - <<'PY' > /tmp/discord-payload.json
          import json
          import os
          import subprocess
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]

          workflows = [
              (
                  "🎓",
                  "TUM HiWi notifier",
                  "check-jobs.yml",
              ),
              (
                  "🏠",
                  "TUM Living notifier",
                  "check-living.yml",
              ),
              (
                  "🚀",
                  "Isar Aerospace notifier",
                  "check-isar.yml",
              ),
          ]

          def latest_run(workflow_file):
              cmd = [
                  "gh",
                  "api",
                  (
                      f"/repos/{repo}/actions/workflows/"
                      f"{workflow_file}/runs?per_page=1"
                  ),
              ]

              raw = subprocess.check_output(
                  cmd,
                  text=True,
              )

              payload = json.loads(raw)

              runs = payload.get(
                  "workflow_runs",
                  [],
              )

              return runs[0] if runs else None


          def pretty_time(value):
              if not value:
                  return "Unknown"

              dt = datetime.fromisoformat(
                  value.replace(
                      "Z",
                      "+00:00",
                  )
              )

              return dt.astimezone(
                  timezone.utc
              ).strftime(
                  "%Y-%m-%d %H:%M UTC"
              )


          fields = []
          all_healthy = True

          for icon, label, filename in workflows:
              run = latest_run(filename)

              if not run:
                  all_healthy = False

                  fields.append({
                      "name": f"{icon} {label}",
                      "value": "⚪ No workflow runs found",
                      "inline": False,
                  })

                  continue

              conclusion = (
                  run.get("conclusion")
                  or run.get("status")
                  or "unknown"
              )

              run_url = run.get(
                  "html_url",
                  "",
              )

              created_at = pretty_time(
                  run.get("created_at")
              )

              event = run.get(
                  "event",
                  "unknown",
              )

              healthy = (
                  conclusion == "success"
              )

              all_healthy = (
                  all_healthy
                  and healthy
              )

              marker = (
                  "🟢"
                  if healthy
                  else "🔴"
              )

              fields.append({
                  "name": f"{icon} {label}",
                  "value": (
                      f"{marker} "
                      f"**{conclusion.upper()}**\n"
                      f"Last run: {created_at}\n"
                      f"Trigger: `{event}`\n"
                      f"[Open run]({run_url})"
                  ),
                  "inline": False,
              })

          now = datetime.now(
              timezone.utc
          ).strftime(
              "%Y-%m-%d %H:%M UTC"
          )

          if all_healthy:
              title = (
                  "💚 Notifiers — Daily Status"
              )

              description = (
                  "All monitoring workflows are healthy."
              )
          else:
              title = (
                  "⚠️ Notifiers — Daily Status"
              )

              description = (
                  "At least one monitoring workflow "
                  "needs attention."
              )

          payload = {
              "username": "Notifier Monitor",
              "embeds": [{
                  "title": title,
                  "description": description,
                  "fields": fields,
                  "footer": {
                      "text": (
                          f"Heartbeat generated {now}"
                      )
                  },
              }],
              "allowed_mentions": {
                  "parse": []
              },
          }

          print(json.dumps(payload))
          PY

      - name: Send combined Discord heartbeat
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_STATUS }}

        run: |
          curl --fail-with-body --silent --show-error \
            -H "Content-Type: application/json" \
            -H "User-Agent: Notifier-Monitor/1.0" \
            --data-binary @/tmp/discord-payload.json \
            "${DISCORD_WEBHOOK_URL}?wait=true"
