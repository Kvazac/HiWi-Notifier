name: TUM notifier status

on:
  schedule:
    # Daily heartbeat at 07:40 UTC
    - cron: "40 7 * * *"

  workflow_dispatch:

  workflow_run:
    workflows:
      - "Check TUM student jobs"
      - "Check TUM Living"
    types:
      - completed

permissions:
  actions: read
  contents: read

jobs:
  failure-alert:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion != 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Send immediate Discord failure alert
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          webhook = os.environ["DISCORD_WEBHOOK_URL"]
          workflow = os.environ["WORKFLOW_NAME"]
          conclusion = os.environ["CONCLUSION"]
          run_url = os.environ["RUN_URL"]
          branch = os.environ["BRANCH"]
          run_number = os.environ["RUN_NUMBER"]

          payload = {
              "username": "TUM Notifier Monitor",
              "embeds": [{
                  "title": "🔴 TUM notifier failure",
                  "description": f"**{workflow}** did not complete successfully.",
                  "fields": [
                      {"name": "Status", "value": conclusion, "inline": True},
                      {"name": "Run", "value": f"#{run_number}", "inline": True},
                      {"name": "Branch", "value": branch or "unknown", "inline": True},
                      {"name": "GitHub Actions", "value": f"[Open failed run]({run_url})", "inline": False},
                  ],
                  "footer": {"text": "Immediate failure alert"},
              }],
              "allowed_mentions": {"parse": []},
          }

          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status >= 300:
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY

  daily-heartbeat:
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Build and send combined Discord heartbeat
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import urllib.request
          from datetime import datetime, timezone

          repo = os.environ["REPOSITORY"]
          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          workflows = [
              ("🎓", "HiWi notifier", "check-jobs.yml"),
              ("🏠", "Living notifier", "check-living.yml"),
          ]

          def latest_run(workflow_file):
              cmd = [
                  "gh", "api",
                  f"/repos/{repo}/actions/workflows/{workflow_file}/runs?per_page=1"
              ]
              raw = subprocess.check_output(cmd, text=True)
              payload = json.loads(raw)
              runs = payload.get("workflow_runs", [])
              return runs[0] if runs else None

          def pretty_time(value):
              if not value:
                  return "Unknown"
              dt = datetime.fromisoformat(value.replace("Z", "+00:00"))
              return dt.astimezone(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          fields = []
          all_healthy = True

          for icon, label, filename in workflows:
              run = latest_run(filename)

              if not run:
                  all_healthy = False
                  fields.append({
                      "name": f"{icon} {label}",
                      "value": "⚪ No workflow runs found",
                      "inline": False,
                  })
                  continue

              conclusion = run.get("conclusion") or run.get("status") or "unknown"
              run_url = run.get("html_url", "")
              created_at = pretty_time(run.get("created_at"))
              event = run.get("event", "unknown")

              healthy = conclusion == "success"
              all_healthy = all_healthy and healthy
              marker = "🟢" if healthy else "🔴"

              value = (
                  f"{marker} **{conclusion.upper()}**\n"
                  f"Last run: {created_at}\n"
                  f"Trigger: `{event}`\n"
                  f"[Open run]({run_url})"
              )

              fields.append({
                  "name": f"{icon} {label}",
                  "value": value,
                  "inline": False,
              })

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          payload = {
              "username": "TUM Notifier Monitor",
              "embeds": [{
                  "title": (
                      "💚 TUM Notifiers — Daily Status"
                      if all_healthy
                      else "⚠️ TUM Notifiers — Daily Status"
                  ),
                  "description": (
                      "Both monitoring workflows are healthy."
                      if all_healthy
                      else "At least one monitoring workflow needs attention."
                  ),
                  "fields": fields,
                  "footer": {"text": f"Heartbeat generated {now}"},
              }],
              "allowed_mentions": {"parse": []},
          }

          request = urllib.request.Request(
              webhook + "?wait=true",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status >= 300:
                  raise RuntimeError(f"Discord returned HTTP {response.status}")
          PY
