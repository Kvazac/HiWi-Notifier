name: Check TUM student jobs

on:
  schedule:
    - cron: "17 * * * *"

  workflow_dispatch:
    inputs:
      send_test_notification:
        description: "Send only a Discord test notification"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tum-job-checker
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send test notification
        if: ${{ inputs.send_test_notification == true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main --test-notification

      - name: Check feed
        if: ${{ inputs.send_test_notification != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python -m src.main

      - name: Persist deduplication state
        if: ${{ inputs.send_test_notification != true }}
        run: |
          if git diff --quiet -- data/state.json; then
            echo "No state changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/state.json
          git commit -m "chore: update notifier state"
          git push
